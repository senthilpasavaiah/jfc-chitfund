name: Build Check

on:
  push:
    branches:
      - activity-log-v2
      - whatsapp-development-v2
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  backend-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: |
          node --check src/routes/activity.routes.js
          node --check src/utils/audit.js
          node --check src/services/chit.service.js
          node --check src/services/notificationScheduler.service.js
          node --check src/services/paymentProof.service.js
          node --check src/services/whatsappPaymentAction.service.js
          node --check src/controllers/whatsappPaymentAction.controller.js
          node --check src/routes/whatsappPaymentAction.routes.js
